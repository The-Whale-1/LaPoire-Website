name: La Poire daily regression

run-name: La Poire ${{ inputs.suite || vars.DAILY_SUITE || 'all' }} / ${{ inputs.project || vars.DAILY_PROJECT || 'chromium' }}

on:
  push:
    branches:
      - main
    paths:
      - 'e2e/**'
      - 'scripts/js/**'
      - 'playwright.config.js'
      - 'package*.json'
      - '.github/workflows/**'
  schedule:
    - cron: '7 6 * * *'
      timezone: Africa/Cairo
  workflow_dispatch:
    inputs:
      suite:
        description: Test scope
        required: true
        type: choice
        default: all
        options:
          - all
          - smoke
      project:
        description: Desktop browser (Chromium is the baseline)
        required: true
        type: choice
        default: chromium
        options:
          - chromium
          - firefox
          - webkit
          - all

permissions:
  contents: read

# Guest contexts isolate browser state, but authenticated carts share server state.
# Use this same group for any future workflow that touches this staging account.
concurrency:
  group: lapoire-staging-regression
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  regression:
    # Scheduled runs already use the default branch. Restrict manual runs too, so
    # a branch with unreviewed test code cannot receive staging/report credentials.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      BASE_URL: https://lapoire-stag.endlg.com/
      RUN_AUTH_TESTS: ${{ vars.RUN_AUTH_TESTS || 'false' }}
      SELF_HEALING: ${{ vars.SELF_HEALING || 'true' }}
      SELF_HEALING_STRICT: ${{ vars.SELF_HEALING_STRICT || 'false' }}
      TEST_RETRIES: '0'

    steps:
      - name: Check out reviewed test code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Validate run options
        id: options
        env:
          SELECTED_SUITE: ${{ inputs.suite || vars.DAILY_SUITE || 'all' }}
          SELECTED_PROJECT: ${{ inputs.project || vars.DAILY_PROJECT || 'chromium' }}
        run: |
          case "$SELECTED_SUITE" in
            all|smoke) ;;
            *) echo 'Invalid suite. Choose all or smoke.' >&2; exit 2 ;;
          esac
          case "$SELECTED_PROJECT" in
            chromium)
              projects="$SELECTED_PROJECT"
              browsers=chromium
              ;;
            firefox|webkit)
              projects="$SELECTED_PROJECT"
              browsers="$SELECTED_PROJECT"
              ;;
            all)
              projects=chromium,firefox,webkit
              browsers=all
              ;;
            *) echo 'Invalid project. Choose a supported desktop browser.' >&2; exit 2 ;;
          esac
          printf 'suite=%s\nprojects=%s\nbrowsers=%s\n' "$SELECTED_SUITE" "$projects" "$browsers" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        id: dependencies
        run: npm ci

      - name: Verify framework helpers offline
        run: npm run test:unit

      - name: Install browser and system dependencies
        env:
          SELECTED_BROWSERS: ${{ steps.options.outputs.browsers }}
        run: |
          if [[ "$SELECTED_BROWSERS" == all ]]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps "$SELECTED_BROWSERS"
          fi

      - name: Run staging tests
        id: tests
        env:
          TEST_PROJECTS: ${{ steps.options.outputs.projects }}
          SELECTED_SUITE: ${{ steps.options.outputs.suite }}
          TEST_EMAIL: ${{ vars.RUN_AUTH_TESTS == 'true' && secrets.TEST_EMAIL || '' }}
          TEST_PASSWORD: ${{ vars.RUN_AUTH_TESTS == 'true' && secrets.TEST_PASSWORD || '' }}
          TEST_CITY: ${{ vars.TEST_CITY }}
          CHECKOUT_CITY: ${{ vars.CHECKOUT_CITY }}
          TEST_PRODUCT: ${{ vars.TEST_PRODUCT }}
        run: |
          set +e
          if [[ "$SELECTED_SUITE" == smoke ]]; then
            npm run test:ci -- --grep '@smoke'
          else
            npm run test:ci
          fi
          test_exit_code=$?
          printf 'exit-code=%s\n' "$test_exit_code" >> "$GITHUB_OUTPUT"
          exit "$test_exit_code"

      - name: Generate Allure HTML
        if: always() && steps.dependencies.outcome == 'success'
        run: npm run report:js

      - name: Write result summary
        if: always() && steps.dependencies.outcome == 'success'
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit-code || '1' }}
          TEST_PROJECTS: ${{ steps.options.outputs.projects }}
          TEST_SUITE: ${{ steps.options.outputs.suite }}
        run: npm run report:summary

      - name: Write setup failure summary without npm dependencies
        if: always() && steps.checkout.outcome == 'success' && steps.dependencies.outcome != 'success'
        env:
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p artifacts/js
          generated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          printf '# La Poire test results\n\n**FAILED: setup did not complete.**\n\nNo staging tests ran. Inspect the checkout, Node.js, options, and dependency-install steps in the workflow logs.\n\n[Cloud run and logs](%s)\n' "$REPORT_RUN_URL" > artifacts/js/summary.md
          printf '{"generatedAt":"%s","environment":"La Poire staging","outcome":"FAILED","counts":{"total":0,"passed":0,"failed":0,"skipped":0,"flaky":0,"healed":0},"exitCode":1,"durationMs":0,"runUrl":"%s","infrastructureErrors":["Setup did not complete; no staging tests ran. Inspect the workflow logs."],"cases":[]}\n' "$generated_at" "$REPORT_RUN_URL" > artifacts/js/summary.json
          cat artifacts/js/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports and failure evidence
        id: reports
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lapoire-js-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/js/allure-results/
            artifacts/js/allure-report/
            artifacts/js/playwright-report/
            artifacts/js/results.json
            artifacts/js/execution.json
            artifacts/js/summary.md
            artifacts/js/summary.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false

      - name: Deliver result notification
        if: always() && steps.checkout.outcome == 'success' && steps.dependencies.outcome == 'success'
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit-code || '1' }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_ARTIFACT_URL: ${{ steps.reports.outputs.artifact-url }}
          REPORT_WEBHOOK_URL: ${{ secrets.REPORT_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE || 'false' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: node scripts/js/notify.cjs
